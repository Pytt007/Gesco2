name: Continuous Integration & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: TypeCheck, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript TypeCheck
        run: npx tsc --noEmit

      - name: Run Core Unit & Service Tests
        run: npx vitest run tests/academicEngine.test.ts tests/finance.test.ts tests/useLocalStorage.test.ts tests/audit/authProxy.test.ts tests/audit/persistence.audit.test.ts tests/audit/transportDraft.test.tsx tests/audit/staffNeonPersistence.test.ts tests/audit/timetableNeonPersistence.test.ts tests/audit/parentsNeonPersistence.test.ts tests/audit/parentLinksNeonPersistence.test.ts tests/audit/medicalRecordsNeonPersistence.test.ts tests/audit/documentsContractsNeonPersistence.test.ts tests/audit/financialEnrollmentRealIdentity.test.ts tests/audit/tuitionPaymentOnlineContract.test.ts tests/audit/schoolYearAuthLoading.test.tsx tests/services/timetableService.test.ts tests/services/staffAttendanceService.test.ts tests/services/attendanceService.test.ts tests/services/auditLogService.test.ts

      - name: Production Build
        run: npm run build
