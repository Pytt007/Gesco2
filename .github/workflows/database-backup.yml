name: Neon Daily Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Encrypted PostgreSQL Backup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.GESCO_BACKUP_PASSPHRASE }}
    steps:
      - name: Check backup secrets
        shell: bash
        run: |
          if [[ -z "${DATABASE_URL:-}" || -z "${BACKUP_PASSPHRASE:-}" ]]; then
            echo '::error::Configure NEON_DATABASE_URL and GESCO_BACKUP_PASSPHRASE repository secrets.'
            exit 1
          fi

      - name: Dump and encrypt Neon database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backups
          umask 077
          docker run --rm -e DATABASE_URL postgres:18 sh -c 'pg_dump --format=custom --no-owner --no-acl "$DATABASE_URL"' \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
                --symmetric --cipher-algo AES256 \
                --output "backups/gesco-neon-${GITHUB_RUN_ID}.dump.gpg" \
                3<<<"$BACKUP_PASSPHRASE"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: gesco-neon-backup-${{ github.run_id }}
          path: backups/*.dump.gpg
          if-no-files-found: error
          retention-days: 7

      - name: Verify decryption and restore in disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          container="gesco-restore-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" \
            -e POSTGRES_PASSWORD="$(openssl rand -hex 32)" postgres:18 >/dev/null
          for attempt in {1..30}; do
            if docker exec -u postgres "$container" pg_isready -q; then break; fi
            sleep 1
          done
          docker exec -u postgres "$container" pg_isready -q
          docker exec -u postgres "$container" createdb gesco_restore
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt "backups/gesco-neon-${GITHUB_RUN_ID}.dump.gpg" \
            3<<<"$BACKUP_PASSPHRASE" \
            | docker exec -u postgres -i "$container" pg_restore \
                --no-owner --no-acl --exit-on-error --dbname=gesco_restore
          table_count="$(docker exec -u postgres "$container" psql -d gesco_restore -Atc \
            "SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname='public'")"
          test "$table_count" -gt 0
          echo "Restore verified: $table_count public tables."
