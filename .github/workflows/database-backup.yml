name: Database Daily Backup

on:
  schedule:
    # Tous les jours à 02h00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Déclenchement manuel autorisé

jobs:
  backup:
    name: Execute Automated Backup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Supabase Backup
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/backup_supabase.cjs

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gesco-database-backup-${{ github.run_id }}
          path: backups/*.gz
          retention-days: 30
