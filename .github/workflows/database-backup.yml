name: Neon Daily Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Encrypted PostgreSQL Backup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.GESCO_BACKUP_PASSPHRASE }}
    steps:
      - name: Check backup secrets
        shell: bash
        run: |
          if [[ -z "${DATABASE_URL:-}" || -z "${BACKUP_PASSPHRASE:-}" ]]; then
            echo '::error::Configure NEON_DATABASE_URL and GESCO_BACKUP_PASSPHRASE repository secrets.'
            exit 1
          fi

      - name: Dump and encrypt Neon database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backups
          umask 077
          docker run --rm -e DATABASE_URL postgres:18 sh -c 'pg_dump --format=custom --no-owner --no-acl "$DATABASE_URL"' \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
                --symmetric --cipher-algo AES256 \
                --output "backups/gesco-neon-${GITHUB_RUN_ID}.dump.gpg" \
                3<<<"$BACKUP_PASSPHRASE"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: gesco-neon-backup-${{ github.run_id }}
          path: backups/*.dump.gpg
          if-no-files-found: error
          retention-days: 7

      - name: Verify encrypted dump is readable
        shell: bash
        run: |
          set -euo pipefail
          table_count="$(gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt "backups/gesco-neon-${GITHUB_RUN_ID}.dump.gpg" \
            3<<<"$BACKUP_PASSPHRASE" \
            | docker run --rm -i postgres:18 pg_restore --list \
            | awk '/ TABLE public / { count++ } END { print count+0 }')"
          test "$table_count" -gt 0
          echo "Encrypted dump readable: $table_count public tables in archive."
